<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Line Test</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: black;
            color: white;
            padding: 10px;
            border-radius: 8px;
            z-index: 100;
            font-size: 14px;
        }
        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: black;
            color: yellow;
            padding: 8px;
            border-radius: 8px;
            z-index: 100;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="info">📍 AR Линия ЮГ → СЕВЕР<br>59.845503, 30.327005</div>
    <div id="status">🟡 Загрузка...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const statusDiv = document.getElementById('status');
        
        // Координаты
        const TARGET_LAT = 59.841968;
        const TARGET_LON = 30.325292;
        const offsetDeg = 0.00027;
        
        // Конвертация GPS в метры
        function gpsToMeters(lat, lon, refLat, refLon) {
            const R = 6371000;
            const dLat = (lat - refLat) * Math.PI / 180;
            const dLon = (lon - refLon) * Math.PI / 180;
            const x = dLon * Math.cos(refLat * Math.PI / 180) * R;
            const z = dLat * R;
            return { x, z };
        }
        
        const ref = { lat: TARGET_LAT, lon: TARGET_LON };
        const south = gpsToMeters(TARGET_LAT - offsetDeg, TARGET_LON, ref.lat, ref.lon);
        const north = gpsToMeters(TARGET_LAT + offsetDeg, TARGET_LON, ref.lat, ref.lon);
        
        // Сцена
        const scene = new THREE.Scene();
        scene.background = null;
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);
        
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        document.body.appendChild(renderer.domElement);
        
        // Освещение
        const light = new THREE.AmbientLight(0xffffff);
        scene.add(light);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);
        
        // Линия Юг-Север
        const points = [
            new THREE.Vector3(south.x, 0, south.z),
            new THREE.Vector3(north.x, 0, north.z)
        ];
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({ color: 0xff3366 });
        const line = new THREE.Line(geometry, material);
        scene.add(line);
        
        // Толстая линия (цилиндр)
        const direction = new THREE.Vector3().subVectors(points[1], points[0]);
        const length = direction.length();
        const cylinderGeo = new THREE.CylinderGeometry(0.1, 0.1, length, 6);
        const cylinderMat = new THREE.MeshStandardMaterial({ color: 0xff6666 });
        const cylinder = new THREE.Mesh(cylinderGeo, cylinderMat);
        cylinder.position.copy(points[0]);
        cylinder.position.add(points[1]).multiplyScalar(0.5);
        cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), direction.clone().normalize());
        scene.add(cylinder);
        
        // Сферы на концах
        const sphereMat = new THREE.MeshStandardMaterial({ color: 0xff6600 });
        const southSphere = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), sphereMat);
        southSphere.position.set(south.x, 0.2, south.z);
        scene.add(southSphere);
        
        const northSphere = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), sphereMat);
        northSphere.position.set(north.x, 0.2, north.z);
        scene.add(northSphere);
        
        // Видеофон (камера)
        const video = document.createElement('video');
        video.autoplay = true;
        video.playsInline = true;
        video.style.position = 'absolute';
        video.style.top = '0';
        video.style.left = '0';
        video.style.width = '100%';
        video.style.height = '100%';
        video.style.objectFit = 'cover';
        video.style.zIndex = '-1';
        document.body.appendChild(video);
        
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                await video.play();
                statusDiv.innerHTML = '✅ Камера работает. Ждём компас...';
            } catch(e) {
                statusDiv.innerHTML = '❌ Нет доступа к камере';
                console.error(e);
            }
        }
        
        // Компас
        let alpha = 0;
        window.addEventListener('deviceorientation', (e) => {
            alpha = e.alpha || 0;
            statusDiv.innerHTML = `🧭 Компас: ${Math.round(alpha)}° | Линия Юг→Север`;
        });
        
        // Анимация
        function animate() {
            camera.rotation.y = -alpha * Math.PI / 180;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        
        startCamera();
        animate();
        
        // Проверка HTTPS
        if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
            statusDiv.innerHTML = '⚠️ Нужен HTTPS. Используйте GitHub Pages';
        }
    </script>
</body>
</html>
