<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Меридиан 100%</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; overflow: hidden; }
    /* Этот блок гарантирует, что текст будет виден поверх камеры */
    #ui-wrapper { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      pointer-events: none; z-index: 9999; 
    }
    #instruction {
      position: absolute; bottom: 15%; width: 100%; text-align: center;
      color: #00FFFF; font-size: 22px; font-weight: bold; 
      text-shadow: 2px 2px 4px #000; text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div id="ui-wrapper">
    <div id="instruction">Водите камерой по асфальту...</div>
  </div>

  <a-scene webxr="optionalFeatures: hit-test, dom-overlay; overlayElement: #ui-wrapper;" ar-hit-test="target:#reticle;">
    
    <!-- Тот самый прицел -->
    <a-entity id="reticle" visible="false">
      <a-ring radius-inner="0.05" radius-outer="0.07" color="#00FFFF" rotation="-90 0 0"></a-ring>
      <a-triangle color="red" vertex-a="0 0.1 0" vertex-b="-0.05 -0.05 0" vertex-c="0.05 -0.05 0" rotation="-90 0 0" position="0 0.01 -0.1"></a-triangle>
    </a-entity>

    <!-- Сама линия (Длина 100м) -->
    <a-entity id="meridian" visible="false">
      <a-box width="0.05" height="0.01" depth="100" color="#00FFFF" opacity="0.8" position="0 0 -50"></a-box>
      <a-circle radius="0.15" color="#FF0055" rotation="-90 0 0" position="0 0.02 0"></a-circle>
    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const reticle = document.getElementById('reticle');
    const meridian = document.getElementById('meridian');
    const text = document.getElementById('instruction');
    let isPlaced = false;

    // Как только пол найден, меняем текст
    reticle.addEventListener('componentchanged', (evt) => {
      if (evt.detail.name === 'visible' && reticle.getAttribute('visible') && !isPlaced) {
        text.innerHTML = "ПОЛ НАЙДЕН!<br><span style='color:#00FF00'>ТАПНИТЕ В ЛЮБОЕ МЕСТО ЭКРАНА</span>";
      }
    });

    // Реакция на ТАП ПО ЭКРАНУ
    window.addEventListener('touchstart', () => {
      // Защита: чтобы линия не ставилась, если пол еще не найден или линия уже стоит
      if (!reticle.getAttribute('visible') || isPlaced) return;
      isPlaced = true;

      // Берем координаты круга
      const pos = reticle.object3D.position;
      // Берем поворот телефона
      const camRotY = document.querySelector('[camera]').object3D.rotation.y;

      // Ставим линию!
      meridian.object3D.position.set(pos.x, pos.y, pos.z);
      meridian.object3D.rotation.set(0, camRotY, 0);

      meridian.setAttribute('visible', 'true');
      reticle.setAttribute('visible', 'false');
      
      text.innerHTML = "<span style='color:#00FF00'>МЕРИДИАН УСТАНОВЛЕН!</span>";
      
      // Отключаем сканер (фиксируем сцену)
      scene.removeAttribute('ar-hit-test');
    });
  </script>
</body>
</html>
